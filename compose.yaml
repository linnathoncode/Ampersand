services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ampersand
      POSTGRES_USER: ampersand
      POSTGRES_PASSWORD: ampersand
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampersand -d ampersand"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
